name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 is intentionally omitted: GraalVM native-image of the Spring Boot
        # orchard-server peaks at ~11 GB RSS, which does not fit GitHub's standard macOS
        # runner (~7 GB), and larger runners are billed. macOS binaries are produced
        # out-of-band until a self-hosted/larger Mac runner is available.
        include:
          - label: linux-amd64
            runner: ubuntu-latest
            os: linux
            arch: amd64
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406  # v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build native images
        run: ./gradlew -PreleaseVersion=${{ steps.version.outputs.version }} :trellis:nativeCompile :trowel:nativeCompile

      # The jars are architecture-independent; one leg builds them so the merged
      # download never holds two files with the same name.
      - name: Build fence and gateway
        if: matrix.arch == 'amd64'
        run: ./gradlew -PreleaseVersion=${{ steps.version.outputs.version }} :fence:bootJar :gateway:bootJar

      - name: Smoke test trowel
        run: |
          echo "=== trowel --version ==="
          BIN=./trowel/build/native/nativeCompile/trowel
          $BIN --version
          $BIN --version | grep -q "${{ steps.version.outputs.version }}" && echo "Version matches tag"
          echo "=== trowel --help ==="
          file $BIN
          $BIN --help

      - name: Smoke test orchard-server
        run: |
          echo "=== orchard-server binary verification ==="
          file trellis/build/native/nativeCompile/orchard-server
          strings trellis/build/native/nativeCompile/orchard-server | grep -q "${{ steps.version.outputs.version }}" && echo "Version string found in binary"

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          cd artifacts

          cp ../trellis/build/native/nativeCompile/orchard-server .
          tar czf orchard-server-${{ matrix.os }}-${{ matrix.arch }}.tar.gz orchard-server
          rm orchard-server

          cp ../trowel/build/native/nativeCompile/trowel .
          tar czf trowel-${{ matrix.os }}-${{ matrix.arch }}.tar.gz trowel
          rm trowel

      - name: Package jars
        if: matrix.arch == 'amd64'
        run: |
          cp fence/build/libs/fence-${{ steps.version.outputs.version }}.jar artifacts/
          cp gateway/build/libs/gateway-${{ steps.version.outputs.version }}.jar artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-${{ matrix.label }}
          path: artifacts/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true

      - name: Checksum artifacts
        run: |
          ls -la
          for jar in fence-*.jar gateway-*.jar; do unzip -tq "$jar"; done
          sha256sum *.tar.gz *.jar | tee checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3
        with:
          generate_release_notes: true
          files: |
            orchard-server-linux-amd64.tar.gz
            orchard-server-linux-arm64.tar.gz
            trowel-linux-amd64.tar.gz
            trowel-linux-arm64.tar.gz
            fence-*.jar
            gateway-*.jar
            checksums-sha256.txt

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir published
          cd published
          sha256sum --check --strict checksums-sha256.txt
