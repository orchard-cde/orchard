name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitattributes'
      - '.gitignore'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Pull requests are filtered here rather than on the trigger so the required
      # "Build & Test" check still reports on docs-only changes.
      - name: Detect code changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          if grep -Eqv '\.md$|^docs/|^LICENSE$|^\.gitattributes$|^\.gitignore$' <<<"$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed; skipping the build"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        if: steps.changes.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew build compileIntegrationTestJava

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
